services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/sessions:/app/sessions
      # Persist Playwright/Chromium browsers on the host so every container
      # restart/rebuild does NOT pay a ~25s x N-workers re-download. The Go
      # binary self-heals: missing versions are downloaded once on demand.
      - /root/.cache/ms-playwright:/root/.cache/ms-playwright
    environment:
      - ENVIRONMENT=production
      - GMAPS_SCRAPER_PATH=/app/google-maps-scraper/google-maps-scraper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - leadforge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      # Published blogs/drafts: a named volume that survives git pull/reset,
      # re-clones and image rebuilds. ./frontend/data is only the first-run seed.
      - BLOGS_DATA_DIR=/app/storage
    volumes:
      - ./frontend/data:/app/data
      - blog-data:/app/storage
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - leadforge

networks:
  leadforge:
    driver: bridge

volumes:
  blog-data:
